<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILIBAN 管理面板</title>
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🚫</span>
        <span class="logo-text">BILIBAN 管理面板</span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="blacklist">📋 黑名单管理</button>
        <button class="tab" data-tab="scan">🔍 评论扫描</button>
        <button class="tab" data-tab="stats">📊 数据面板</button>
        <button class="tab" data-tab="advanced">⚙️ 高级设置</button>
      </nav>
    </header>
    <!-- ==================== 黑名单管理 ==================== -->
    <section class="tab-content active" id="tab-blacklist">
      <div class="toolbar">
        <div class="toolbar-left">
          <button id="btn-add-group" class="primary-btn">+ 新建分组</button>
          <button id="btn-add-chunk" class="secondary-btn">+ 新建分块</button>
        </div>
        <div class="toolbar-right">
          <button id="btn-import" class="icon-btn" title="导入本地备份">📥</button>
          <button id="btn-export" class="icon-btn" title="导出本地备份">📤</button>
          <button id="btn-export-piliplus" class="secondary-btn" title="导出所有启用分组的 UID（去重），用于 PiliPlus 黑名单导入">导出 PiliPlus</button>
          <span class="stats" id="stats"></span>
        </div>
      </div>
      <div class="groups-container" id="groups-container">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-text">还没有屏蔽分组<br>点击上方按钮创建第一个分组</div>
        </div>
      </div>
    </section>
    <!-- ==================== 数据面板 ==================== -->
    <section class="tab-content" id="tab-stats">
      <div class="card stats-overview">
        <div class="card-title">📊 使用概览</div>
        <div class="stats-overview-grid">
          <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总触发次数</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-video">0</div><div class="stat-label">触发视频数</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-comment">0</div><div class="stat-label">触发评论数</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-7d">0</div><div class="stat-label">近 7 天</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-storage">0 B</div><div class="stat-label" id="stat-storage-label">存储占用</div></div>
        </div>
      </div>
      <div class="card stats-chart-card">
        <div class="card-title">频率曲线</div>
        <div class="stats-chart-controls">
          <select id="stats-granularity" class="small-select">
            <option value="day">按天</option>
            <option value="week">按周</option>
            <option value="month">按月</option>
          </select>
          <select id="stats-range" class="small-select">
            <option value="7">近 7 天</option>
            <option value="30" selected>近 30 天</option>
            <option value="90">近 90 天</option>
          </select>
          <span class="stats-chart-legend"><span class="legend-dot total"></span>总触发 <span class="legend-dot video"></span>视频 <span class="legend-dot comment"></span>评论</span>
        </div>
        <div class="stats-chart-wrap">
          <canvas id="stats-chart" width="900" height="300"></canvas>
          <div class="stats-chart-empty" id="stats-chart-empty" style="display:none">暂无数据，触发屏蔽后这里会显示频率曲线</div>
        </div>
      </div>
      <div class="card stats-actions">
        <button id="stats-refresh" class="secondary-btn">⟳ 刷新</button>
        <span class="stats-cleanup-label">清理</span>
        <input type="datetime-local" id="stats-cleanup-time" class="time-input" title="清理该时间之前的数据（不含该时间点）">
        <span class="stats-cleanup-label">之前的数据</span>
        <button id="stats-clear" class="danger-btn">清理数据</button>
        <span class="scan-hint" id="stats-hint"></span>
      </div>
    </section>
    <!-- ==================== 高级设置 ==================== -->
    <section class="tab-content" id="tab-advanced">
      <div class="card stats-advanced">
        <div class="card-title">🗂️ 记录设置</div>
        <div class="adv-grid">
          <label class="opt-item checkbox-item"><input type="checkbox" id="adv-record-comment"> 记录评论命中</label>
          <label class="opt-item checkbox-item"><input type="checkbox" id="adv-record-video"> 记录视频命中</label>
        </div>
        <div class="adv-actions">
          <button id="adv-save" class="primary-btn">保存设置</button>
          <button id="adv-reset" class="secondary-btn">恢复默认</button>
          <span class="scan-hint" id="adv-hint"></span>
        </div>
      </div>
      <div class="card stats-advanced">
        <div class="card-title">☁️ GitHub 仓库设置</div>
        <div class="adv-grid">
          <label class="opt-item wide">备份仓库名称<input type="text" id="gh-repo-name" class="text-input" style="width:220px" placeholder="BILI-Blacklist" title="黑名单备份仓库名，所有者由 GitHub Token 决定"></label>
        </div>
        <div class="scan-hint" style="margin-bottom:8px">仓库所有者由 GitHub Token 决定；修改名称后，下次推送会自动创建/使用新仓库。</div>
        <div class="adv-actions">
          <button id="gh-repo-save" class="primary-btn">保存仓库设置</button>
          <span class="scan-hint" id="gh-repo-hint"></span>
        </div>
      </div>
      <div class="card stats-advanced">
        <div class="card-title">🔑 GitHub 账户设置</div>
        <div class="adv-grid">
          <label class="opt-item">GitHub Token<input type="password" id="gh-token-input" class="text-input" style="width:220px" placeholder="ghp_xxxx 或 github_pat_xxxx" title="需要 repo 权限"></label>
          <label class="opt-item wide">黑名单仓库可见性<select id="gh-visibility" class="small-select"><option value="private">🔒 私有</option><option value="public">🌐 公共</option></select></label>
        </div>
        <div class="adv-actions">
          <button id="gh-token-save" class="primary-btn">保存设置</button>
          <span class="scan-hint" id="gh-account-status"></span>
        </div>
      </div>
    </section>
    <!-- ==================== 评论扫描 ==================== -->
    <section class="tab-content" id="tab-scan">
      <!-- 扫描配置 -->
      <div class="card scan-config">
        <div class="card-title">🎯 扫描入口</div>
        <div class="scan-input-row">
          <input type="text" id="scan-video-input" placeholder="粘贴视频链接 / BV号 / av号，例如 https://www.bilibili.com/video/BV1xx..." class="text-input">
          <button id="scan-use-tab" class="secondary-btn">使用当前标签页</button>
        </div>
        <div class="scan-cache-row">
          <label class="opt-item checkbox-item cache-max-item">缓存上限
            <input type="number" id="cache-max" class="num-input" value="10" min="0" max="50">
          </label>
          <label class="opt-item cache-pick-item">加载缓存
            <select id="cache-select" class="small-select cache-select"><option value="">(暂无缓存)</option></select>
            <button id="cache-load" class="secondary-btn-sm" disabled>📂 加载</button>
            <button id="cache-del" class="secondary-btn-sm" disabled>🗑 删除</button>
          </label>
          <button id="cache-fav" class="secondary-btn-sm" disabled title="收藏的缓存不会被自动清理，只能手动删除">⭐ 收藏</button>
        </div>
        <div class="scan-options">
          <label class="opt-item">排序
            <select id="scan-mode">
              <option value="3">热门</option>
              <option value="2">最新</option>
            </select>
          </label>
          <!-- 时间范围：仅「最新」排序启用 -->
          <label class="opt-item" id="scan-time-range-item" style="display:none">
            <span class="time-range-label">时间范围</span>
            <input type="datetime-local" id="scan-time-from" class="time-input" title="起始时间（较新）。留空 = 从最新评论开始">
            <span class="time-range-arrow">→</span>
            <input type="datetime-local" id="scan-time-to" class="time-input" title="终止时间（较旧）。只设终止 = 从最新评论拉到该时刻">
          </label>
          <label class="opt-item">最大页数
            <input type="number" id="scan-max-pages" value="10" min="0" max="500" class="num-input">
          </label>
          <label class="opt-item checkbox-item">
            <input type="checkbox" id="scan-row-click" title="点击评论即可勾选，无需精准点小框框"> 全行点击
          </label>
        </div>
        <div class="scan-actions">
          <button id="scan-start" class="primary-btn">▶ 开始扫描</button>
          <button id="scan-stop" class="danger-btn" disabled>⏹ 停止</button>
          <span class="scan-hint" id="scan-status-hint">扫描在后台进行，页面可随意切换</span>
        </div>
      </div>
      <!-- 扫描进度 -->
      <div class="card scan-progress" id="scan-progress" style="display:none">
        <div class="card-title">📈 扫描进度</div>
        <div class="progress-meta" id="scan-video-info"></div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="scan-progress-bar"></div></div>
        <div class="progress-lines">
          <span id="scan-progress-text">等待开始...</span>
          <span class="progress-note" id="scan-note"></span>
        </div>
      </div>
      <!-- 扫描结果 -->
      <div class="card scan-results" id="scan-results" style="display:none">
        <div class="card-title">🧾 匹配结果 <span class="title-sub" id="scan-result-summary"></span></div>
        <div class="result-toolbar">
          <span class="filter-label">🔍 搜索：</span>
          <input type="text" id="scan-search-input" class="search-input" placeholder="输入关键词，筛选带该词的评论（命中置顶，未命中变灰）">
          <span class="search-count" id="scan-search-count"></span>
          <span class="toolbar-spacer"></span>
          <label class="checkbox-item">
            <input type="checkbox" id="scan-select-all"> 全选
          </label>
        </div>
        <div class="batch-bar" id="scan-batch-bar">
          <span>批量操作：</span>
          <select id="scan-batch-group" class="small-select"></select>
          <button id="scan-batch-add" class="primary-btn-sm">加入黑名单</button>
          <button id="scan-batch-ignore" class="secondary-btn-sm">忽略</button>
          <span class="batch-hint" id="scan-batch-hint"></span>
        </div>
        <div class="result-list" id="scan-result-list"></div>
      </div>
    </section>
  </div>
  <!-- 隐藏的文件导入 -->
  <input type="file" id="file-import" accept=".json" style="display:none">
  <!-- 通用对话框 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="secondary-btn" id="modal-cancel">取消</button>
        <button class="primary-btn" id="modal-confirm">确认</button>
      </div>
    </div>
  </div>
  <script src="../lib/storage.js"></script>
  <script src="../lib/github.js"></script>
  <script src="manage.js"></script>
  <script src="stats.js"></script>
</body>
</html>
