<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILIBAN - B站用户屏蔽</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">🚫</span>
          <span class="logo-text">BILIBAN</span>
        </div>
        <button id="btn-manage" class="icon-btn" title="打开完整管理面板">⚙️</button>
      </div>
      <div class="header-actions">
        <button id="btn-import" class="icon-btn" title="导入本地备份">📥</button>
        <button id="btn-export" class="icon-btn" title="导出本地备份">📤</button>
      </div>
    </header>

    <!-- GitHub 同步面板（弹窗即云同步界面，常驻展示） -->
    <div class="github-panel" id="github-panel">
      <div class="github-panel-header">
        <span class="github-title">☁️ 云端 & 订阅</span>
      </div>

      <!-- Tab 切换 -->
      <div class="github-tabs">
        <button class="github-tab active" data-tab="sync">云端备份</button>
        <button class="github-tab" data-tab="subscribe">社区订阅</button>
      </div>

      <!-- Tab: 云端备份 -->
      <div class="github-tab-content" id="tab-sync">
        <div class="github-section" id="github-sync-section" style="display:none">
          <div class="github-user" id="github-user-info"></div>

          <!-- 分块同步（新建/编辑分块请到完整管理面板） -->
          <div class="chunk-section">
            <div class="chunk-header">
              <label class="github-label">云端分块</label>
              <span class="github-hint" style="margin-top:0">编辑分块请到管理面板</span>
            </div>
            <div class="chunk-list" id="chunk-list"></div>
            <div class="chunk-actions">
              <button id="btn-push-selected" class="github-action-btn push" disabled>
                <span class="btn-icon">⬆️</span><span>推送选中块</span>
              </button>
              <button id="btn-pull-selected" class="github-action-btn pull" disabled>
                <span class="btn-icon">⬇️</span><span>拉取选中块</span>
              </button>
            </div>
            <div class="github-hint" id="chunk-sync-status"></div>
          </div>

          <!-- 快捷操作 -->
          <div class="github-actions">
            <button id="github-push" class="github-action-btn push">
              <span class="btn-icon">📦</span><span>推送全部</span>
            </button>
            <button id="github-pull" class="github-action-btn pull">
              <span class="btn-icon">📥</span><span>拉取全部</span>
            </button>
          </div>
          <div class="github-hint" id="github-sync-status"></div>
          <div class="github-link" id="github-link" style="display:none">
            <a href="#" target="_blank" id="github-link-url">查看云端备份</a>
          </div>
        </div>

        <!-- 设置（置于底部） -->
        <div class="github-section" id="github-token-section">
          <label class="github-label">GitHub Token</label>
          <div class="github-input-row">
            <input type="password" id="github-token-input" placeholder="ghp_xxxx 或 github_pat_xxxx" class="github-input">
            <button id="github-token-save" class="primary-btn-sm">验证</button>
          </div>
          <div class="github-hint" id="github-token-status"></div>
          <div class="github-hint">需要 <code>repo</code> 权限，在 <a href="https://github.com/settings/tokens/new?scopes=repo&description=BILIBAN" target="_blank">GitHub Settings</a> 创建</div>
        </div>
        <div class="github-section" id="github-visibility-section">
          <label class="github-label">仓库可见性</label>
          <div class="visibility-toggle">
            <button id="vis-private" class="visibility-option private active" data-vis="private">🔒 私有</button>
            <button id="vis-public" class="visibility-option public" data-vis="public">🌐 公共</button>
          </div>
          <div class="github-hint" id="visibility-status">私有仓库仅自己可见；公共仓库可被社区订阅。切换后在下一次推送时自动生效。</div>
        </div>
      </div>

      <!-- Tab: 社区订阅 -->
      <div class="github-tab-content" id="tab-subscribe" style="display:none">
        <div class="github-section">
          <label class="github-label">添加订阅源</label>
          <div class="github-input-row">
            <input type="text" id="source-input" placeholder="owner/repo 或完整 URL" class="github-input">
            <button id="source-add" class="primary-btn-sm">添加</button>
          </div>
          <div class="github-hint">支持格式：<code>owner/repo</code>、<code>owner/repo/path.json</code>、完整 GitHub URL</div>
          <div class="github-hint" id="source-add-status"></div>
        </div>
        <div class="github-section">
          <div class="source-actions-row">
            <button id="source-pull-all" class="github-action-btn pull" style="flex:1">
              <span class="btn-icon">🔄</span><span>从全部源拉取合并</span>
            </button>
          </div>
          <div class="github-hint" id="source-pull-status"></div>
        </div>
        <div class="github-section">
          <label class="github-label">已订阅 (<span id="source-count">0</span>)</label>
          <div class="source-list" id="source-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 隐藏的文件导入 -->
  <input type="file" id="file-import" accept=".json" style="display:none">

  <!-- 确认对话框 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="secondary-btn" id="modal-cancel">取消</button>
        <button class="danger-btn" id="modal-confirm">确认</button>
      </div>
    </div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/github.js"></script>
  <script src="popup.js"></script>
</body>
</html>
